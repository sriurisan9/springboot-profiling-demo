apiVersion: v1
kind: Namespace
metadata:
  name: profiling-demo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profiling-demo
  namespace: profiling-demo
  labels:
    app: profiling-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: profiling-demo
  template:
    metadata:
      labels:
        app: profiling-demo
    spec:
      serviceAccountName: profiling-demo-sa
      containers:
        - name: profiling-demo
          image: your-docker-repo/profiling-demo:0.1.0
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: profiling-demo
  namespace: profiling-demo
spec:
  selector:
    app: profiling-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: profiling-demo-sa
  namespace: profiling-demo
